version: '3.8'

services:
  db:
    image: mysql:8
    container_name: hephaitos_db
    environment:
      MYSQL_DATABASE: hephaitos_db
      MYSQL_USER: hephaitos_user
      MYSQL_PASSWORD: hephaitos_pass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - hephaitos_net
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hephaitos_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/hephaitos_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=hephaitos_user
      - SPRING_DATASOURCE_PASSWORD=hephaitos_pass
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
    ports:
      - "8080:8080"
    networks:
      - hephaitos_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hephaitos_frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - hephaitos_net

networks:
  hephaitos_net:
    driver: bridge

volumes:
  db_data:
